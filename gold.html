<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伦敦金 Kronos 预测</title><style>body{font:16px system-ui,sans-serif;max-width:1100px;margin:32px auto;padding:0 16px;color:#20252b}h1{font-size:25px}#updated{color:#66717d}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{padding:8px 14px;background:white;border:1px solid #bac2ca;border-radius:4px;cursor:pointer}.tabs button[aria-pressed=true]{background:#e8f1ed;border-color:#47846b}table{width:100%;border-collapse:collapse}th,td{text-align:right;padding:9px;border-bottom:1px solid #e3e7e9}th:first-child,td:first-child{text-align:left}.note{color:#68727c;font-size:13px}</style><h1>伦敦金 XAU/USD · Kronos 预测</h1><div id="updated">加载中</div><nav class="tabs" id="tabs"></nav><div id="content"></div><p class="note">模型输出仅用于研究和演示，不构成投资建议。现货黄金数据通常没有集中成交量，本页面以零成交量输入模型，预测结果可能不适用于实盘决策。</p><script>fetch('gold_forecasts.json?'+Date.now()).then(r=>r.json()).then(d=>{document.querySelector('#updated').textContent='数据更新：'+d.updated_at+' UTC · 行情源：'+d.provider;let current=d.timeframes[0]?.timeframe;const render=()=>{document.querySelector('#tabs').innerHTML=d.timeframes.map(x=>`<button aria-pressed="${x.timeframe===current}" data-tf="${x.timeframe}">${x.timeframe}</button>`).join('');document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{current=b.dataset.tf;render()});const x=d.timeframes.find(y=>y.timeframe===current);document.querySelector('#content').innerHTML=x?`<p>最近收盘：<b>${x.last_close.toFixed(3)}</b> · K线时间：${x.as_of}</p><table><thead><tr><th>预测时间 (UTC)</th><th>下界</th><th>均值</th><th>上界</th></tr></thead><tbody>${x.timestamps.map((t,i)=>`<tr><td>${new Date(t).toISOString().replace('T',' ').slice(0,16)}</td><td>${x.low[i].toFixed(3)}</td><td>${x.forecast[i].toFixed(3)}</td><td>${x.high[i].toFixed(3)}</td></tr>`).join('')}</tbody></table>`:'暂无预测数据'};render()}).catch(e=>document.querySelector('#content').textContent='加载预测失败：'+e);</script></html>
